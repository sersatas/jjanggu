<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#101418">
  <title>짱구</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 시작 화면: 마이크·소리 권한을 얻기 위해 한 번 터치 필요 -->
  <div id="start" class="overlay">
    <div class="start-face">🖍️</div>
    <h1>짱구</h1>
    <p>화면을 눌러서 시작하세요</p>
    <p class="sub">"짱구야, 날씨 어때?" · "짱구야, 아이유 노래 틀어줘"</p>
  </div>

  <!-- 설정: 키는 이 태블릿 브라우저에만 저장됨 -->
  <div id="settings" class="overlay hidden">
    <form id="settings-form" autocomplete="off">
      <h2>설정</h2>
      <p class="sub">키는 이 태블릿 안에만 저장돼요.</p>
      <label>Gemini API 키<input id="set-geminiKey" type="password" required></label>
      <label>YouTube API 키<input id="set-youtubeKey" type="password"></label>
      <label>모델<input id="set-model"></label>
      <div class="row">
        <label>기준 위치<input id="set-homeName"></label>
        <label>위도<input id="set-homeLat" inputmode="decimal"></label>
        <label>경도<input id="set-homeLon" inputmode="decimal"></label>
      </div>
      <div class="row buttons">
        <button type="button" id="set-cancel">취소</button>
        <button type="submit" class="primary">저장</button>
      </div>
    </form>
  </div>

  <button id="gear" aria-label="설정">⚙</button>

  <main id="app">
    <section id="left">
      <div id="clock">
        <div id="time">--:--</div>
        <div id="date"></div>
      </div>

      <div id="talk">
        <div id="you" class="bubble you"></div>
        <div id="bot" class="bubble bot"></div>
      </div>

      <div id="controls">
        <button id="mic" aria-label="말하기">
          <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/></svg>
        </button>
        <div id="status">준비 중…</div>
      </div>

      <form id="typebox" autocomplete="off">
        <input id="typein" placeholder="말 대신 입력해도 돼요" />
      </form>
    </section>

    <section id="right" class="empty">
      <div id="player-wrap"><div id="yt"></div></div>
      <div id="now"></div>
      <div id="pbtns">
        <button data-act="previous">⏮</button>
        <button data-act="toggle" id="ptoggle">⏸</button>
        <button data-act="next">⏭</button>
        <button data-act="volume_down">🔉</button>
        <button data-act="volume_up">🔊</button>
        <button data-act="stop">✕</button>
      </div>
    </section>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="brain.js"></script>
  <script src="app.js"></script>
</body>
</html>
